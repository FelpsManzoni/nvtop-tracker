# Template: init.sh writes prometheus.yml from it.
global:
  scrape_interval: 2s
  scrape_timeout: 2s

# Remote hosts' series arrive by remote write, labeled by their agent.
scrape_configs:
  - job_name: nvtop
    static_configs:
      - targets: ["127.0.0.1:19101"]
        labels:
          server: "__SERVER_NAME__" # must match a server name in config.json
